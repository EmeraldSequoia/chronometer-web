name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome! Please note that the project is in maintenance mode, so the bar for new features is high and most won't be implemented.
  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to see?
      description: Describe the change and why it would be useful.
    validations:
      required: true
