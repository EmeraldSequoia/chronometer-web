      <div id="time-bar">
        <button id="time-bar-label">⏱ Show time controller</button>
        <span id="time-bar-info">
          <span id="time-bar-date"></span>
          <span id="time-bar-offset"></span>
          <span id="time-bar-rate"></span>
        </span>
        <button class="time-bar-btn" id="time-bar-now">Now</button>
      </div>

      <!-- Time controller popover (docs/time-controller.md): one panel. The
           unit chips choose what a step means; the one ◀ ▶ pair steps (tap)
           or scrubs (hold) by it; the ‹ › body stepper appears for rise / set /
           transit. Wired by src/shared/time-controls-ui.ts; each page positions
           #time-popover itself. -->
      <div id="time-popover" style="display: none">
        <div id="tp-panel">
          <div class="tp-top-row">
            <div class="tp-transport" id="tp-transport"></div>
            <button id="tp-close" title="Close" aria-label="Close">&times;</button>
          </div>
          <div id="tp-rate-label">1× (real time)</div>
          <div class="tp-label">Step by</div>
          <div id="tp-units" role="group" aria-label="Step unit">
            <button class="tp-chip" data-unit="yr" title="Years">yr</button>
            <button class="tp-chip" data-unit="mo" title="Months">mo</button>
            <button class="tp-chip" data-unit="day" title="Days">day</button>
            <button class="tp-chip" data-unit="hr" title="Hours">hr</button>
            <button class="tp-chip" data-unit="min" title="Minutes">min</button>
            <button class="tp-chip" data-unit="sec" title="Seconds">sec</button>
            <button class="tp-chip tp-chip-astro" data-unit="rise" title="Rise of the chosen body">rise</button>
            <button class="tp-chip tp-chip-astro" data-unit="set" title="Set of the chosen body">set</button>
            <button class="tp-chip tp-chip-astro" data-unit="transit" title="Transit (meridian crossing) of the chosen body">transit</button>
            <button class="tp-chip tp-chip-astro" data-unit="phase" title="Quarter phase of the Moon">phase</button>
          </div>
          <div id="tp-body-row" hidden>
            <button class="tp-btn tp-body-btn" id="tp-body-prev" title="Previous body" aria-label="Previous body">‹</button>
            <span id="tp-body-name">Moon</span>
            <button class="tp-btn tp-body-btn" id="tp-body-next" title="Next body" aria-label="Next body">›</button>
          </div>
          <div class="tp-step-pair">
            <button class="tp-btn tp-step-btn" id="tp-step-back" data-dir="-1" title="Step back (hold to scrub)" aria-label="Step back">◀</button>
            <span id="tp-step-label">1 day</span>
            <button class="tp-btn tp-step-btn" id="tp-step-fwd" data-dir="1" title="Step forward (hold to scrub)" aria-label="Step forward">▶</button>
          </div>
          <div class="tp-label">Set date &amp; time</div>
          <div class="tp-date-inputs">
            <input id="tp-year" type="number" min="1" max="4000" placeholder="YYYY" aria-label="Year" />
            <input id="tp-month" type="number" min="1" max="12" placeholder="MM" aria-label="Month" />
            <input id="tp-day" type="number" min="1" max="31" placeholder="DD" aria-label="Day" />
          </div>
          <div class="tp-date-inputs">
            <button id="tp-bce" title="Toggle BCE (Before Common Era)">CE</button>
            <input id="tp-hour" type="number" min="0" max="23" placeholder="HH" aria-label="Hour" />
            <input id="tp-minute" type="number" min="0" max="59" placeholder="mm" aria-label="Minute" />
          </div>
        </div>
        <!-- Hands-free scrubbing (docs/time-controller.md): the padlock shows
             while a held scrub's pointer is where a release would keep it
             running, and stays up, faded with the panel, once it does. -->
        <div id="tp-lock-badge" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="96" height="96" focusable="false">
            <path d="M20 29v-9a12 12 0 0 1 24 0v9" fill="none" stroke="#4cd964" stroke-width="6" stroke-linecap="round"/>
            <rect x="11" y="29" width="42" height="30" rx="7" fill="#4cd964"/>
            <circle cx="32" cy="41" r="4.5" fill="#1a1a2e"/>
            <rect x="29.5" y="41" width="5" height="10" rx="2.5" fill="#1a1a2e"/>
          </svg>
        </div>
      </div>
